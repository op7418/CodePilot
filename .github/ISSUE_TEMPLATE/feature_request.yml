name: "Feature request / 功能建议"
description: "建议一个新功能或改进 / Suggest a feature or improvement"
labels: ["enhancement", "v0.57+ parking-lot"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议或改进想法。请先描述实际遇到的问题与使用场景，便于评估优先级与设计方案。
        _Feature requests and improvement ideas are welcome. Please describe the underlying problem and use case first so we can prioritize and design cleanly._
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem"
      description: "你遇到的实际痛点是什么？不要直接写解决方案。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "设想的方案 / Proposal"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的替代方案 / Alternatives"
    validations:
      required: false
